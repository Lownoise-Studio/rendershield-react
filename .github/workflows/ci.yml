name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: Source unit / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ensure clean dist (source tests must not need it)
        run: rm -rf dist
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/

  consumers:
    name: Consumer smoke (React ${{ matrix.react }})
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18.3.1", "19"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist/
      - name: Pack + ESM/CJS/TS/SSR consumers (React ${{ matrix.react }})
        run: node scripts/smoke-consumers.mjs --react=${{ matrix.react }} --from-built
